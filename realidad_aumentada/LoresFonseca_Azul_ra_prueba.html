<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba 3D</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>

  <a-scene>

    <!-- Fondo -->
    <a-sky color="#222"></a-sky>

    <!-- Suelo -->
    <a-plane
      position="0 0 -4"
      rotation="-90 0 0"
      width="6"
      height="6"
      color="#555">
    </a-plane>

    <!-- Contenedor del objeto -->
    <a-entity id="modelo" position="0 0 -4">

      <!-- Base -->
      <a-cylinder
        position="0 0.3 0"
        radius="0.5"
        height="0.6"
        color="#888">
      </a-cylinder>

      <!-- Nivel 1 -->
      <a-cylinder
        position="0 0.9 0"
        radius="0.35"
        height="0.6"
        color="#aaa">
      </a-cylinder>

      <!-- Nivel 2 -->
      <a-cylinder
        position="0 1.5 0"
        radius="0.25"
        height="0.6"
        color="#ccc">
      </a-cylinder>

      <!-- Parte superior -->
      <a-cone
        position="0 2 0"
        radius-bottom="0.25"
        height="0.5"
        color="red">
      </a-cone>

      <!-- PUERTA -->
      <a-box
        position="0 0.35 0.51"
        width="0.25"
        height="0.4"
        depth="0.05"
        color="#5c4033">
      </a-box>

    </a-entity>

    <!-- Cámara -->
    <a-camera position="0 1.6 0"></a-camera>

  </a-scene>

</body>
</html>
