<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sol y Luna</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>
  <body>
  <script>

  // Estado de Sol y Luna
  let xS, yS, dS, rS, vS;   // Sol
  let xL, yL, dL, rL, vL;   // Luna

  function setup() {
   
    createCanvas(600, 800);

    // Sol
    dS = min(width, height) * 0.20;
    rS = dS / 2;
    xS = -rS;
    yS = height / 4;
    vS = width / 400;

    // Luna
    dL = dS * 0.5;
    rL = dL / 2;
    xL = -width - rL;
    yL = height / 3;
    vL = vS;
  }

  function draw() {

    // Cielo según la posición del Sol
    if (xS <= width + rS) {
      background(0, 0, 255);   // Día
    } else {
      background(10);          // Noche
    }

    // Suelo 
    noStroke();
    fill(20, 120, 40);
    rect(0, 0.8 * height, width, 0.2 * height);

    // Sol
    noStroke();
    fill(245, 234, 10);
    circle(xS, yS, dS);

    //  Luna
    noStroke();
    fill(200);
    circle(xL, yL, dL);

    // Movimiento sincronizado del sol y la luna
    xS = xS + vS;
    xL = xL + vL;

    // Reinicio por posición del Sol
    if (xS > 2 * width + rS) {
      xS = -rS;
      xL = -width - rL;
    }

    // Depuración 
    textSize(14);
    stroke(255, 0, 0);
    fill(255);
    text("xS: " + xS, 10, 20);
    text("xL: " + xL, 10, 40);
  }

  </script>
  </body>
</html>
