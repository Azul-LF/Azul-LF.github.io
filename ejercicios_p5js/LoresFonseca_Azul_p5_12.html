<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Tarea 12 · Sol, Luna y Calendario</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>

  <body>
    <script>

      // Estado del Sol
      let xS, yS, dS, rS, vS;

      // Estado de la Luna
      let xL, yL, dL, rL, vL;

      // Estado del calendario
      let dia, mes, año;

      function setup() {

        createCanvas(600, 800);

        // Sol
        dS = min(width, height) * 0.2;
        rS = dS / 2;
        xS = -rS;
        yS = height / 4;
        vS = width / 400;

        // Luna
        dL = dS * 0.5;
        rL = dL / 2;
        xL = -width - rL;
        yL = height / 3;
        vL = vS;

        // Calendario 
        dia = 18;
        mes = 12;
        año = 2025;
      }

      function draw() {

        // Cielo según la posición del Sol
        if (xS <= width + rS) {
          background(0, 0, 255); // Día
        } else {
          background(10);        // Noche
        }

        // Suelo
        noStroke();
        fill(20, 120, 40);
        rect(0, height * 0.8, width, height * 0.2);

        // Sol
        noStroke();
        fill(245, 234, 10);
        circle(xS, yS, dS);

        // Luna
        noStroke();
        fill(200);
        circle(xL, yL, dL);

        // Movimiento sincronizado
        xS = xS + vS;
        xL = xL + vL;

        // Fin del día: el Sol completa su ciclo
        if (xS > 2 * width + rS) {

          // Reinicio posiciones
          xS = -rS;
          xL = -width - rL;

          // Incremento del día
          dia = dia + 1;

          // Cambio de mes
          if (dia > 30) {
            dia = 1;
            mes = mes + 1;
          }

          // Cambio de año
          if (mes > 12) {
            mes = 1;
            año = anio + 1;
          }
        }

        //TEXTO DEL CALENDARIO 
        noStroke();

        // Color según día o noche
        if (xS <= width + rS) {
          fill(0);
        } else {
          fill(255);
        }

        textSize(20);
        text("Fecha: (" + dia + ") (" + mes + ") (" + año + ")", 10, 20);
      }

    </script>
  </body>
</html>
