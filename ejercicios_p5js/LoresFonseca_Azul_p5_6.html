<!doctype html> <!-- Indica que es un documento HTML -->
<html>
  <head>
    <meta charset="utf-8" /> 
    <title>Azul</title> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  </head>

  <body>
    <h1>Casa</h1>


    <script>

function setup() {
    createCanvas(800,800);

    // 1) Tamaños relativos
    d = min(width, height) * 0.12;
    r = d / 2;

    // 2) Posición inicial relativa (evita números mágicos)
    x = -r;              // empieza entrando
    y = height * 0.75;   // por ejemplo, altura de una carretera

    // 3) Velocidad relativa al ancho
    v = width / 500;
  }
  
  function draw() {
  background(144,213,255);
  //Suelo
	fill(10,191,20);
    stroke(10,191,20);
    strokeWeight(3);
	rect(0,600,800,200);
	
    //Sol en movimiento
       fill(255,240,46,200);
       strokeWeight(3);
       stroke(255,240,46,200);
       circle(x/2,height/6,d,d);
       x=x+v
	
    //Casa
       //Rectángulo
       fill(242,133,56);
       stroke(242,133,56);
       strokeWeight(2);
       rect(75,275,325,325);

       //Techo
       fill(102,0,0);
       stroke(102,0,0);
       strokeWeight(2);
       triangle(55,275,425,275,245,100);

       //Puerta
       fill(189,138,55);
       stroke(135,87,19);
       strokeWeight(3);
       rect(200,500,75,100);
       line(200,550,275,550);
       
       //Ventanas de abajo
       fill(255,240,46);
       stroke(135,87,19);
       
       rect(100,475,60,60);
       line(100,505,160,505);
       line(130,475,130,535);

       rect(300,475,60,60);
       line(300,505,360,505);
       line(330,475,330,535);

       //Ventanas de arriba

       rect(115,340,60,100);
       line(145,340,145,440);
       line(115,365,175,365);
       
       fill(135,87,19);
       rect(115,390,60,50);

       fill(255,240,46);
       rect(200,340,60,100);
       line(230,340,230,440);
       line(200,365,260,365);

       fill(135,87,19);
       rect(200,390,60,50);

       fill(255,240,46);
       rect(285,340,60,100);
       line(315,340,315,440);
       line(285,365,345,365);

       fill(135,87,19);
       rect(285,390,60,50);

       //Balcón
       stroke(117,73,22);
       strokeWeight(8);
       line(75,360,400,360);
       line(75,440,400,440);

       line(75,360,75,440);
       line(115,360,115,440);
       line(155,360,155,440);
       line(195,360,195,440);
       line(235,360,235,440);
       line(275,360,275,440);
       line(315,360,315,440);
       line(355,360,355,440);
       line(400,360,400,440);
	   
       //Coche
       fill(141,222,252);
       strokeWeight(3);
       stroke(93,130,148);
       arc(x,height/1.75,d*2,d,PI,0);
	   
	   x=x+v

       fill(153,183,201);
       stroke(93,130,148);
       ellipse(x,height/1.7,d*3.5,d/1.9);
	   
	   x=x+v

       stroke(0);
       strokeWeight(3);
       line(x-d*1.7,d*4.87,x+d*1.7,d*4.87);
	   
	   x=x+v

       //Luces

       stroke(0,76,255);
       strokeWeight(2);
       fill(0,76,255,150);
       circle(x-d*1.3,d*4.87,9,9);
	   
	   x=x+v

       stroke(255,54,0);
       strokeWeight(2);
       fill(255,54,0,150);
       circle(x-d*1,d*4.87,9,9);
	   
	   x=x+v

       stroke(13,255,0);
       strokeWeight(2);
       fill(13,255,0,150);
       circle(x-d*0.7,d*4.87,9,9);
	   
	   x=x+v

       stroke(217,0,255);
       strokeWeight(2);
       fill(217,0,255,150);
       circle(x-d*0.4,d*4.87,9,9);
	   
	   x=x+v

       stroke(246,255,0);
       strokeWeight(2);
       fill(246,255,0,150);
       circle(x-d*0.1,d*4.87,9,9);
	   
	   x=x+v

       stroke(0,76,255);
       strokeWeight(2);
       fill(0,76,255,150);
       circle(x+d*0.2,d*4.87,9,9);
	   
	   x=x+v

       stroke(255,54,0);
       strokeWeight(2);
       fill(255,54,0,150);
       circle(x+d*0.5,d*4.87,9,9);
	   
	   x=x+v

       stroke(13,255,0);
       strokeWeight(2);
       fill(13,255,0,150);
       circle(x+d*0.8,d*4.87,9,9);
	   
	   x=x+v

       stroke(217,0,255);
       strokeWeight(2);
       fill(217,0,255,150);
       circle(x+d*1.1,d*4.87,9,9);
	   
	   x=x+v

       stroke(246,255,0);
       strokeWeight(2);
       fill(246,255,0,150);
       circle(x+d*1.4,d*4.87,9,9);

       x=x+v

	}
	
</script>
</body>
</html>
